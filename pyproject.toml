[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-flow"
version = "0.1.0"
description = "Local Windows dictation app powered by Vulkan whisper.cpp, Silero VAD, and llama.cpp"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
    "sounddevice>=0.4.6",
    "PyAudioWPatch>=0.2.12.9",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "httpx>=0.27.0",
]

[project.scripts]
whisper-flow = "whisper_flow.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
